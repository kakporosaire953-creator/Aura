<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1712" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/assets/aura-favicon.png" />
    <script>
      // Garde-fou des révélations : le contenu est visible par défaut ;
      // le masquage animé n'attend que si JavaScript démarre vraiment.
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!document.documentElement.classList.contains('reveal-on')) {
          document.documentElement.classList.add('reveal-off');
        }
      }, 2500);
    </script>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <title>AURA — De l'idée au résultat.</title>
    <meta
      name="description"
      content="AURA réunit conversation, recherche sourcée, création et exécution dans un seul fil de pensée. De l'idée au résultat."
    />
    <meta property="og:title" content="AURA — De l'idée au résultat." />
    <meta
      property="og:description"
      content="Une plateforme d'intelligence artificielle où l'idée devient résultat : conversation, recherche, création, développement."
    />
    <meta property="og:image" content="/assets/aura-symbol-white.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Applique le thème et la langue avant le premier rendu (anti-flash)
      try {
        var th = localStorage.getItem('aura_theme');
        if (th !== 'dark' && th !== 'light') {
          th = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = th;
        var lg = localStorage.getItem('aura_lang') === 'en' ? 'en' : 'fr';
        document.documentElement.lang = lg;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; text-align: center">
        AURA est une application interactive qui nécessite JavaScript.
        Activez JavaScript dans votre navigateur pour l'utiliser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
